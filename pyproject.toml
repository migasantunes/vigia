[project]
name = "vigia"
version = "0.1.0"
description = "Spotting wildfire smoke in the first minutes: spatiotemporal smoke detection for fixed lookout cameras."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "José Miguel Luís Antunes" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Heavy stacks are optional so the core (data contracts, splits, metrics,
# alert policy) installs and tests in seconds on any machine and in CI.
vision = ["opencv-python-headless>=4.9", "albumentations>=1.4", "pillow>=10"]
train = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0", "mlflow>=2.14"]
serve = ["fastapi>=0.111", "uvicorn>=0.30", "onnx>=1.16", "onnxruntime>=1.18"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
vigia = "vigia.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigia"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "vision: needs the 'vision' extra (OpenCV)",
    "train: needs the 'train' extra (PyTorch)",
    "serve: needs the 'serve' extra (FastAPI / ONNX Runtime)",
    "data: needs real datasets on disk",
]

[tool.mypy]
strict = true
files = ["src/vigia"]
ignore_missing_imports = true
